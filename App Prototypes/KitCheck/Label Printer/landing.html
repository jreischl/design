document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ row.bad }}\" hint-placeholder-val=\"{{ false }}\">\n                    <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 6l12 12M18 6L6 18\" stroke=\"#F24335\" stroke-width=\"2.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                <\u002Fspan>\n                <div style=\"padding-top:4px;\">\n                  <div style=\"font-size:24px; font-weight:700; color:#fff; line-height:1.2;\">{{ row.title }}<\u002Fdiv>\n                  <div style=\"font-size:16px; font-weight:400; color:#D7EBF1; margin-top:6px;\">{{ row.sub }}<\u002Fdiv>\n                  <sc-if value=\"{{ row.hasChips }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex; flex-wrap:wrap; gap:12px; margin-top:16px;\">\n                      <sc-for list=\"{{ row.chips }}\" as=\"chip\" hint-placeholder-count=\"3\">\n                        <div style=\"display:inline-flex; align-items:center; gap:9px; height:42px; padding:0 18px 0 7px; border:1px solid rgba(255,255,255,.45); border-radius:999px;\">\n                          <span style=\"width:26px; height:26px; border-radius:50%; background:{{ chip.bg }}; display:flex; align-items:center; justify-content:center;\">\n                            <sc-if value=\"{{ chip.ok }}\" hint-placeholder-val=\"{{ true }}\">\n                              <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 13l4.2 4L19 7\" stroke=\"#16B434\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                            <\u002Fsc-if>\n                            <sc-if value=\"{{ chip.bad }}\" hint-placeholder-val=\"{{ false }}\">\n                              <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 6l12 12M18 6L6 18\" stroke=\"#F24335\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                            <\u002Fsc-if>\n                          <\u002Fspan>\n                          <span style=\"font-size:16px; font-weight:600; color:#fff;\">{{ chip.label }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"width:1px; align-self:stretch; background:#74C5D8;\"><\u002Fdiv>\n\n        <!-- hardware -->\n        <div style=\"width:540px; padding-left:54px;\">\n          <div style=\"font-size:13px; font-weight:600; letter-spacing:2.4px; color:#CFEAF1; margin-bottom:30px;\">HARDWARE<\u002Fdiv>\n          <sc-for list=\"{{ hwFields }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <div style=\"{{ f.wrapStyle }}\">\n              <div style=\"font-size:13px; font-weight:600; letter-spacing:1.8px; color:#9FD0DE; margin-bottom:10px;\">{{ f.label }}<\u002Fdiv>\n              <div style=\"font-size:24px; font-weight:600; color:#fff; letter-spacing:.2px;\">{{ f.value }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ REBOOT MODAL ============ -->\n  <div style=\"{{ rebootScrimStyle }}\">\n    <sc-if value=\"{{ rebootConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:480px; background:#fff; border-radius:14px; padding:34px 34px 28px; color:#1c2226;\">\n        <div style=\"font-size:24px; font-weight:900; color:#1c2226;\">Reboot system?<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:500; color:#5d676c; line-height:1.5; margin-top:12px;\">The printer goes offline for about a minute. Jobs in the queue are held and resume automatically once it reconnects to KC-API.<\u002Fdiv>\n        <div style=\"display:flex; gap:12px; margin-top:28px;\">\n          <button onclick=\"{{ cancelReboot }}\" style=\"flex:1; height:54px; border:1px solid #D6DCDF; background:#fff; color:#54606a; border-radius:9px; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;\">Cancel<\u002Fbutton>\n          <button onclick=\"{{ doReboot }}\" style=\"flex:1; height:54px; border:none; background:#EB4699; color:#fff; border-radius:9px; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;\">Reboot now<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ rebootBusy }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; flex-direction:column; align-items:center; gap:22px; color:#fff;\">\n        <span style=\"width:64px; height:64px; border-radius:50%; border:5px solid rgba(255,255,255,.25); border-top-color:#fff; animation:lp-spin .9s linear infinite;\"><\u002Fspan>\n        <div style=\"text-align:center;\">\n          <div style=\"font-size:24px; font-weight:700;\">Rebooting…<\u002Fdiv>\n          <div style=\"font-size:16px; font-weight:600; color:#CFEAF1; margin-top:6px;\">Reconnecting to KC-API<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ cancelOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:500px; background:#fff; border-radius:14px; padding:34px 34px 28px; color:#1c2226;\">\n        <div style=\"display:flex; align-items:center; gap:14px;\">\n          <span style=\"flex-shrink:0; width:46px; height:46px; border-radius:50%; background:#FFF3D6; display:flex; align-items:center; justify-content:center;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3.4 1.8 21h20.4L12 3.4z\" stroke=\"#B8860B\" stroke-width=\"1.9\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M12 10v4.4\" stroke=\"#B8860B\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"12\" cy=\"17.6\" r=\"1.15\" fill=\"#B8860B\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n          <div style=\"font-size:23px; font-weight:900; color:#1c2226;\">Stop tag verification?<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:500; color:#5d676c; line-height:1.5; margin-top:14px;\">These tags will need to be associated manually using a KitCheck scanner.<\u002Fdiv>\n        <div style=\"display:flex; gap:12px; margin-top:28px;\">\n          <button onclick=\"{{ dismissCancel }}\" style=\"flex:1; height:54px; border:1px solid #D6DCDF; background:#fff; color:#54606a; border-radius:9px; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;\">Cancel<\u002Fbutton>\n          <button onclick=\"{{ confirmCancel }}\" style=\"flex:1; height:54px; border:none; background:#EB4699; color:#fff; border-radius:9px; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;\">Confirm<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1290,&quot;height&quot;:800},&quot;stationName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Compounding Station 3&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pharmacyName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Anacostia Central Pharmacy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;connectionHealthy&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;printerAddress&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;192.168.1.47 : 9100&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      connOpen:false,\n      reboot:null,            // null | 'confirm' | 'busy'\n      healthOverride:null,    // null = follow prop; true/false = forced\n      cancelJobId:null,       // job whose verification the user is force-cancelling\n      // status = print lifecycle: 'queued' | 'printing' | 'printed'\n      // verify = tag association: null | 'verifying' | 'verified' | 'manual'\n      jobs:[\n        { id:'j1', name:'rocuronium 5 mg per 5 mL (10 mg per mL)', qty:6, lot:'RC4471', exp:'2027-03', status:'printing', progress:45, ts:'Jun 22, 12:48' },\n        { id:'j2', name:'oxyTOCIN 30 unit / 500 mL', qty:2, lot:'OX2210', exp:'2026-11', status:'queued', progress:0, ts:'Jun 22, 12:49' },\n        { id:'j3', name:'succinylcholine 200 mg per 10 mL (20 mg per mL)', qty:3, lot:'SX9038', exp:'2026-09', status:'queued', progress:0, ts:'Jun 22, 12:50' },\n        { id:'c1', name:'vancoMYcin 2000 mg / 5 mL', qty:4, lot:'VN1185', exp:'2027-01', status:'printed', verify:'verifying', attempt:2, vt:0, tagsWillFail:true, ts:'Jun 22, 12:46' },\n        { id:'c2', name:'DEXTROSE 50% 25 g / 50 mL', qty:3, lot:'DX7742', exp:'2028-05', status:'printed', verify:'verified', attempt:1, ts:'Jun 22, 12:31' },\n        { id:'c3', name:'PHEHYLephrine 1 mg per 10 mL', qty:1, lot:'PH3306', exp:'2026-08', status:'printed', verify:'manual', attempt:3, ts:'Jun 22, 12:18' },\n      ],\n    };\n  }\n\n  componentDidMount() {\n    this._timer = setInterval(() => {\n      if (this.state.reboot === 'busy') return;\n      this.setState(s => {\n        let jobs = s.jobs.map(j => ({ ...j }));\n        // advance the active print\n        let printing = jobs.find(j => j.status === 'printing');\n        if (!printing) {\n          const next = jobs.find(j => j.status === 'queued');\n          if (next) { next.status = 'printing'; printing = next; }\n        }\n        if (printing) {\n          printing.progress = Math.min(100, printing.progress + 7);\n          if (printing.progress >= 100) {\n            printing.status = 'printed';\n            printing.verify = 'verifying';\n            printing.attempt = 1;\n            printing.vt = 0;\n            printing.tagsWillFail = false; // freshly printed jobs verify cleanly\n          }\n        }\n        // run tag-association retries on printed jobs\n        jobs.forEach(j => {\n          if (j.status === 'printed' && j.verify === 'verifying') {\n            j.vt = (j.vt || 0) + 1;\n            if (j.vt >= 6) {            // ~4s per attempt\n              j.vt = 0;\n              if (!j.tagsWillFail) j.verify = 'verified';\n              else if (j.attempt < 3) j.attempt += 1;\n              else j.verify = 'manual'; // exhausted 3 retries\n            }\n          }\n        });\n        return { jobs };\n      });\n    }, 700);\n  }\n  componentWillUnmount() { clearInterval(this._timer); }\n\n  healthy() {\n    if (this.state.healthOverride !== null) return this.state.healthOverride;\n    return this.props.connectionHealthy !== false;\n  }\n\n  doReboot() {\n    this.setState({ reboot:'busy' });\n    clearTimeout(this._rebootT);\n    this._rebootT = setTimeout(() => {\n      this.setState({ reboot:null, healthOverride:true });\n    }, 3400);\n  }\n\n  jobView(j, queuePos) {\n    const printing = j.status === 'printing';\n    const upNext = j.status === 'queued' && queuePos === 1;\n    const map = printing\n      ? { t:'Printing', bg:'#E1F4F9', fg:'#0096B8', icoBg:'#E1F4F9' }\n      : upNext\n        ? { t:'Up next', bg:'#E1F4F9', fg:'#0096B8', icoBg:'#E1F4F9' }\n        : { t:'Queued', bg:'#EFEFEF', fg:'#777', icoBg:'#F1F3F4' };\n    const waitText = queuePos ? (queuePos === 1 ? 'Starts next' : `${queuePos} ahead in line`) : '';\n    return {\n      ...j,\n      isActive:true, isDone:false,\n      isPrinting:printing,\n      isUpNext:upNext,\n      isQueued: !printing && !upNext,\n      isVerified:false, isVerifying:false, isManual:false,\n      showForceCancel:false,\n      nameColor:'#1c2226', metaColor:'#8A949A',\n      meta:`Lot ${j.lot} · Exp ${j.exp} · Qty ${j.qty} · Submitted ${j.ts}`,\n      statusLabel:map.t,\n      iconWrap:`flex-shrink:0; width:56px; height:56px; border-radius:50%; background:${map.icoBg}; display:flex; align-items:center; justify-content:center;`,\n      badgeStyle:`flex-shrink:0; font-size:12px; font-weight:600; letter-spacing:.4px; padding:7px 14px; border-radius:999px; background:${map.bg}; color:${map.fg};`,\n      cardStyle:`background:#fff; border:1px solid ${printing?'#9FD9E8':'#EAEAEA'}; border-radius:12px; padding:18px 20px;`,\n      showProgress: printing,\n      showWait: !printing,\n      waitText,\n      progressPct: j.progress + '%',\n      progressText: 'Printing ' + j.progress + '% · ' + j.qty + ' labels',\n    };\n  }\n\n  doneView(j, isFirstDone) {\n    const verifying = j.verify === 'verifying';\n    const verified = j.verify === 'verified';\n    const manual = j.verify === 'manual';\n    const ico = manual ? '#FBE3E1' : verifying ? '#FFF4D8' : '#E4F6E4';\n    const tagsPill = verifying\n      ? 'background:#FFF3D6; color:#B8860B;'\n      : verified\n        ? 'background:#E2F5E2; color:#1E7E33;'\n        : 'background:#FBE3E1; color:#C0392B;';\n    const tagsLabel = verifying\n      ? `Verifying tags · attempt ${j.attempt} of 3`\n      : verified ? 'Tags verified' : 'Associate manually';\n    return {\n      ...j,\n      isActive:false, isDone:true,\n      isPrinting:false, isUpNext:false, isQueued:false,\n      isVerified:verified, isVerifying:verifying, isManual:manual,\n      showHeader:isFirstDone,\n      nameColor:'#fff', metaColor:'rgba(255,255,255,.72)',\n      meta:`Lot ${j.lot} · Exp ${j.exp} · Qty ${j.qty} · Printed ${j.ts}`,\n      iconWrap:`flex-shrink:0; width:56px; height:56px; border-radius:50%; background:${ico}; display:flex; align-items:center; justify-content:center;`,\n      cardStyle:`background:transparent; border:1px solid #fff; border-radius:12px; padding:18px 20px;`,\n      showProgress:false, showWait:false,\n      tagsPillStyle:`display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 16px; border-radius:999px; font-size:14px; font-weight:600; ${tagsPill}`,\n      tagsLabel,\n      showForceCancel:verifying,\n      onForceCancel:() => this.setState({ cancelJobId:j.id }),\n      showRetry:manual,\n      onRetry:() => this.setState(st => ({\n        jobs: st.jobs.map(x => x.id === j.id ? { ...x, verify:'verifying', attempt:1, vt:0, tagsWillFail:false } : x),\n      })),\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const healthy = this.healthy();\n    const station = this.props.stationName ?? 'Compounding Station 3';\n    const addr = this.props.printerAddress ?? '192.168.1.47 : 9100';\n\n    // active (printing + queued) and completed (printed)\n    const printingJobs = s.jobs.filter(j => j.status === 'printing');\n    const queuedJobs = s.jobs.filter(j => j.status === 'queued');\n    const doneJobs = s.jobs.filter(j => j.status === 'printed');\n    let qpos = 0;\n    const activeViews = [\n      ...printingJobs.map(j => this.jobView(j, 0)),\n      ...queuedJobs.map(j => this.jobView(j, ++qpos)),\n    ];\n    const doneViews = doneJobs.map((j, i) => this.doneView(j, i === 0));\n    const allJobs = [...activeViews, ...doneViews];\n    const nPrint = printingJobs.length;\n    const nQueue = queuedJobs.length;\n    const nDone = doneJobs.length;\n    const nManual = doneJobs.filter(j => j.verify === 'manual').length;\n    const summaryBits = [];\n    if (nPrint) summaryBits.push(`${nPrint} printing`);\n    if (nQueue) summaryBits.push(`${nQueue} upcoming`);\n    if (nManual) summaryBits.push(`${nManual} need manual association`);\n    const summaryText = summaryBits.length ? summaryBits.join(' · ') : 'Idle · printer ready';\n    const totalBits = [];\n    if (nPrint + nQueue) totalBits.push(`${nPrint + nQueue} active`);\n    if (nDone) totalBits.push(`${nDone} completed`);\n    const totalLabel = totalBits.join(' · ');\n\n    // connection\n    const connStatuses = [\n      {\n        ok: healthy, bad: !healthy,\n        badgeBg: healthy ? '#DBEDD7' : '#FCD9D7',\n        rowStyle: 'padding-bottom:30px; margin-bottom:30px; border-bottom:1px solid rgba(255,255,255,.28);',\n        title: 'Connected to KC-API',\n        sub: healthy ? 'Last handshake Jun 22, 2026 at 12:48' : 'Unreachable since Jun 22, 2026 at 03:10',\n        hasChips:false, chips:[],\n      },\n      {\n        ok: healthy, bad: !healthy,\n        badgeBg: healthy ? '#DBEDD7' : '#FCD9D7',\n        rowStyle: '',\n        title: healthy ? 'Printer online & ready' : 'Printer reported a fault',\n        sub: healthy ? 'Thermal head OK · media loaded · 300 DPI' : 'Media-out detected on the label path',\n        hasChips:false, chips:[],\n      },\n    ];\n\n    const hwRows = [\n      { label:'HARDWARE NAME', value:`${station} · Label Printer` },\n      { label:'PRINTER ADDRESS', value: addr },\n      { label:'KC-API ENDPOINT', value:'api.kitcheck.com' },\n      { label:'FIRMWARE', value:'v4.2.1 (build 1180)' },\n      { label:'LAST SUCCESSFUL PRINT', value:'Jun 22, 2026 at 12:48' },\n    ];\n    const hwFields = hwRows.map((r,i) => ({\n      ...r,\n      wrapStyle: (i < hwRows.length-1)\n        ? 'padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid rgba(255,255,255,.28);'\n        : '',\n    }));\n\n    return {\n      stationName: station,\n      pharmacyName: this.props.pharmacyName ?? 'Anacostia Central Pharmacy',\n\n      // header connection chip\n      openConnection:() => this.setState({ connOpen:true }),\n      connStatusLabel: healthy ? 'All systems connected' : 'Connection issue',\n      connDotColor: healthy ? '#16B434' : '#F24335',\n      connDotHalo: healthy ? 'rgba(22,180,52,.2)' : 'rgba(242,67,53,.2)',\n      connBorder: healthy ? '#E2E2E2' : '#F4C6C2',\n      connTextColor: healthy ? '#555' : '#C0392B',\n\n      // queue\n      showConnWarning: !healthy,\n      allJobs,\n      summaryText,\n      totalLabel,\n      printingPulse: nPrint ? 'lp-pulse 1.4s ease-in-out infinite' : 'none',\n      summaryDotColor: nPrint ? '#A9DDEC' : (nManual ? 'rgb(251, 227, 225)' : '#fff'),\n      summaryDotHalo: nPrint ? 'rgba(169,221,236,.34)' : 'transparent',\n      queueEmpty: allJobs.length === 0,\n\n      // force-cancel verification dialog\n      cancelOpen: s.cancelJobId !== null,\n      dismissCancel:() => this.setState({ cancelJobId:null }),\n      confirmCancel:() => this.setState(st => ({\n        cancelJobId:null,\n        jobs: st.jobs.map(j => j.id === st.cancelJobId ? { ...j, verify:'manual' } : j),\n      })),\n\n      // connection overlay\n      closeConnection:() => this.setState({ connOpen:false }),\n      connOverlayStyle:`position:absolute; inset:0; background:#0096B8; z-index:13; display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.2,0,.2,1); transform:translateX(${s.connOpen?'0':'100%'});`,\n      lastSync:'Jun 22, 2026 at 12:48',\n      connStatuses,\n      hwFields,\n\n      // reboot\n      askReboot:() => this.setState({ reboot:'confirm' }),\n      cancelReboot:() => this.setState({ reboot:null }),\n      doReboot:() => this.doReboot(),\n      rebootConfirm: s.reboot === 'confirm',\n      rebootBusy: s.reboot === 'busy',\n      rebootScrimStyle:`position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:${s.reboot==='busy'?'rgba(0,82,101,.92)':'rgba(10,30,40,.5)'}; transition:opacity .2s; ${(s.reboot||s.cancelJobId!==null)?'opacity:1;':'opacity:0; pointer-events:none;'}`,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
