      <nav class="crumbs"><a href="../../">Home</a><span class="sep">/</span><a href="../../Application Prototypes/">Application Prototypes</a><span class="sep">/</span><a href="../../Application Prototypes/CostCheck/">CostCheck</a></nav>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search all files…" autocomplete="off">
        <select id="sort" title="Sort by">
          <option value="name">Name</option>
          <option value="size">Size</option>
          <option value="mtime">Modified</option>
        </select>
      </div>
    </header>

    

    <ul class="filelist" id="search-results" hidden></ul>
    <ul class="filelist" id="filelist">
      <li><a class="row parent" href="../"><svg class="icon icon-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><div class="info"><div class="name">Back</div></div></a></li>
      
      
    </ul>
  </aside>

  <main class="viewer" data-active="false">
    <div class="viewer-body">
      <iframe id="frame" src="" title="File preview"></iframe>
    </div>
  </main>
</div>

<script>
(function() {
  const layout      = document.querySelector('.layout');
  const sidebar     = document.querySelector('.sidebar');
  const filelist    = document.getElementById('filelist');
  const searchRes   = document.getElementById('search-results');
  const search      = document.getElementById('search');
  const sortSel     = document.getElementById('sort');
  const frame       = document.getElementById('frame');
  const viewer      = document.querySelector('.viewer');
  const collapseBtn = document.getElementById('collapse-btn');
  const expandBtn   = document.getElementById('expand-btn');

  const allItems = [...filelist.querySelectorAll('li')].filter(li => li.querySelector('.row:not(.parent)'));
  const allRows  = allItems.map(li => li.querySelector('.row'));

  // SEARCH_INDEX_PATH is the relative URL from THIS page to /_search-index.json.
  const SEARCH_INDEX_PATH = '../../_search-index.json';
  // SITE_BASE is the relative URL from THIS page to the site root.
  const SITE_BASE = '../../';

  function isHtmlFile(name) { return /\.html?$/i.test(name); }

  function setActive(absHref, name) {
    if (absHref) {
      frame.src = absHref;
      viewer.dataset.active = 'true';
    } else {
      frame.src = 'about:blank';
      viewer.dataset.active = 'false';
    }
    allRows.forEach(r => r.classList.toggle('active', r.dataset.absHref === absHref));
  }

  function applyLockForFile(isHtml) {
    if (isHtml) {
      layout.classList.remove('locked-open');
    } else {
      layout.classList.add('locked-open');
      layout.classList.remove('collapsed');
    }
  }

  function setCollapsed(collapsed) {
    if (collapsed && layout.classList.contains('locked-open')) return;
    layout.classList.toggle('collapsed', collapsed);
  }

  // ---- File click ----
  filelist.addEventListener('click', (e) => {
    const link = e.target.closest('a.row');
    if (!link || !link.dataset.iframe) return;
    e.preventDefault();
    setActive(link.dataset.absHref, link.dataset.name);
    applyLockForFile(isHtmlFile(link.dataset.name));
    history.replaceState({}, '', '#' + encodeURIComponent(link.dataset.name));
  });

  // ---- Restore from hash on load ----
  function restoreFromHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) return;
    const match = allRows.find(r => r.dataset.name === h && r.dataset.iframe);
    if (match) {
      setActive(match.dataset.absHref, match.dataset.name);
      applyLockForFile(isHtmlFile(match.dataset.name));
    }
  }
  restoreFromHash();
  window.addEventListener('hashchange', restoreFromHash);

  // ---- Sidebar toggle ----
  collapseBtn.addEventListener('click', () => {
    setCollapsed(true);
    sidebar.classList.add('peek-suppress');
  });
  sidebar.addEventListener('mouseleave', () => sidebar.classList.remove('peek-suppress'));
  expandBtn.addEventListener('click', () => setCollapsed(false));

  // ---- Global search ----
  const ICON_PATHS = {
    folder:  '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
    image:   '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    video:   '<path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>',
    audio:   '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    archive: '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
    code:    '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
    doc:     '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>',
    sheet:   '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h8M8 17h8M8 9h2"/>',
    slides:  '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><rect x="8" y="12" width="8" height="6" rx="1"/>',
    file:    '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>',
  };
  const iconHtml = (cat) => `<svg class="icon icon-${cat}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[cat] || ICON_PATHS.file}</svg>`;
  const escapeHtml = (s) => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let treeCache = null, treePromise = null, lastQuery = '';
  const RESULT_LIMIT = 200;

  function fetchTree() {
    if (treeCache) return Promise.resolve(treeCache);
    if (treePromise) return treePromise;
    treePromise = fetch(SEARCH_INDEX_PATH)
      .then(r => r.json())
      .then(d => { treeCache = d; return d; })
      .catch(() => { treeCache = []; return []; })
      .finally(() => { treePromise = null; });
    return treePromise;
  }

  function showLocalList() { searchRes.hidden = true; filelist.hidden = false; }
  function showSearchResults() { filelist.hidden = true; searchRes.hidden = false; }

  function rankItem(item, q) {
    const n = item.name.toLowerCase();
    if (n === q) return 0;
    if (n.startsWith(q)) return 1;
    if (n.includes(q)) return 2;
    return 3;
  }

  function renderResults(q) {
    if (!treeCache) {
      searchRes.innerHTML = '<li class="empty-list">Loading file index…</li>';
      showSearchResults();
      return;
    }
    const matches = [];
    for (const item of treeCache) {
      const n = item.name.toLowerCase(), p = item.path.toLowerCase();
      if (n.includes(q) || p.includes(q)) matches.push({ item, score: rankItem(item, q) });
    }
    matches.sort((a, b) => {
      if (a.score !== b.score) return a.score - b.score;
      if (a.item.isDir !== b.item.isDir) return a.item.isDir ? -1 : 1;
      return a.item.name.localeCompare(b.item.name, undefined, { numeric: true, sensitivity: 'base' });
    });
    if (matches.length === 0) {
      searchRes.innerHTML = '<li class="empty-list">No matches.</li>';
      showSearchResults();
      return;
    }
    const visible = matches.slice(0, RESULT_LIMIT);
    const html = visible.map(({ item }) => {
      // Build URL relative to current page using SITE_BASE.
      let href;
      if (item.isDir) {
        href = SITE_BASE + item.path + '/';
      } else if (item.parent) {
        href = SITE_BASE + item.parent + '/#' + encodeURIComponent(item.name);
      } else {
        href = SITE_BASE + '#' + encodeURIComponent(item.name);
      }
      const where = item.parent ? '/' + escapeHtml(item.parent) : '/';
      return `<li><a class="row" href="${href}">${iconHtml(item.cat)}<div class="info"><div class="name">${escapeHtml(item.name)}</div><div class="meta">${where}</div></div></a></li>`;
    }).join('');
    let footer = '';
    if (matches.length > RESULT_LIMIT) {
      const extra = matches.length - RESULT_LIMIT;
      footer = `<li class="empty-list">${extra} more match${extra === 1 ? '' : 'es'} — refine your search</li>`;
    }
    searchRes.innerHTML = html + footer;
    showSearchResults();
  }

  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    lastQuery = q;
    if (!q) { showLocalList(); return; }
    if (treeCache) {
      renderResults(q);
    } else {
      searchRes.innerHTML = '<li class="empty-list">Loading file index…</li>';
      showSearchResults();
      fetchTree().then(() => { if (lastQuery) renderResults(lastQuery); });
    }
  });

  document.addEventListener('keydown', (e) => {
    const tag = (document.activeElement?.tagName || '').toLowerCase();
    const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select';
    if (e.key === '/' && !isTyping) { e.preventDefault(); search.focus(); search.select(); }
    else if ((e.key === 'z' || e.key === 'Z') && !isTyping && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      const willCollapse = !layout.classList.contains('collapsed');
      setCollapsed(willCollapse);
      if (willCollapse) sidebar.classList.add('peek-suppress');
    } else if (e.key === 'Escape' && layout.classList.contains('collapsed')) {
      setCollapsed(false);
    }
  });

  // ---- Sort ----
  sortSel.addEventListener('change', () => {
    const key = sortSel.value;
    const sorted = allItems.slice().sort((a, b) => {
      const ar = a.querySelector('.row'), br = b.querySelector('.row');
      const aF = ar.dataset.cat === 'folder', bF = br.dataset.cat === 'folder';
      if (aF !== bF) return aF ? -1 : 1;
      let av = ar.dataset[key], bv = br.dataset[key];
      if (key === 'name') return av.localeCompare(bv, undefined, { numeric: true, sensitivity: 'base' });
      return (+bv) - (+av);
    });
    const parentLi = filelist.querySelector('li > .row.parent')?.parentElement;
    sorted.forEach(li => filelist.appendChild(li));
    if (parentLi) filelist.insertBefore(parentLi, filelist.firstChild);
  });
})();
</script>
</body>
</html>
